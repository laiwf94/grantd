# nginx in front of the whoami app, with wicket as the auth_request backend.
# wicket and whoami run on the Docker host; the demo starts this in Docker.
events {}

http {
  upstream wicket { server host.docker.internal:4180; }
  upstream whoami { server host.docker.internal:8081; }

  server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate     /etc/nginx/certs/tls.pem;
    ssl_certificate_key /etc/nginx/certs/tls-key.pem;

    # Browser-facing wicket endpoints: login, callbacks, ACS, logout, JWKS.
    location /_wicket/ {
      proxy_pass http://wicket/;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The subrequest. "internal" keeps clients from calling it directly.
    location = /_wicket/auth {
      internal;
      proxy_pass http://wicket/auth?app=whoami;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-Uri $request_uri;
      proxy_set_header X-Forwarded-Method $request_method;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      auth_request /_wicket/auth;
      auth_request_set $auth_user     $upstream_http_x_auth_user;
      auth_request_set $auth_email    $upstream_http_x_auth_email;
      auth_request_set $auth_groups   $upstream_http_x_auth_groups;
      auth_request_set $auth_token    $upstream_http_x_auth_token;
      auth_request_set $auth_redirect $upstream_http_x_auth_redirect;
      error_page 401 = @login;

      # Always set (or, when empty, remove) the identity headers, so a
      # client can never pass its own X-Auth-* through to the app.
      proxy_set_header X-Auth-User   $auth_user;
      proxy_set_header X-Auth-Email  $auth_email;
      proxy_set_header X-Auth-Groups $auth_groups;
      proxy_set_header X-Auth-Token  $auth_token;
      proxy_pass http://whoami;
    }

    location @login {
      return 302 $auth_redirect;
    }
  }
}
