name: wicket

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# wicket now lives in the root module: internal/authn, cmd/wicket,
# cmd/fakeidp and examples/whoami. This gate keeps its own fuzz targets until
# the single ci.yml gate replaces it.
env:
  AUTHN: internal/authn cmd/wicket cmd/fakeidp examples/whoami
  AUTHN_PKGS: ./internal/authn/... ./cmd/wicket/... ./cmd/fakeidp/... ./examples/whoami/...

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l $AUTHN)" || (gofmt -l $AUTHN && exit 1)
      - name: Vet
        run: go vet $AUTHN_PKGS
      - name: Test (race, coverage)
        run: go test -race -coverprofile=coverage.out $AUTHN_PKGS
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1
      - name: Fuzz (short)
        run: |
          go test ./internal/authn/jose -run=^$ -fuzz=FuzzParse$ -fuzztime=20s
          go test ./internal/authn/jose -run=^$ -fuzz=FuzzParseKeySet -fuzztime=20s
          go test ./internal/authn/seal -run=^$ -fuzz=FuzzOpen -fuzztime=20s
          go test ./internal/authn/redirect -run=^$ -fuzz=FuzzValidate -fuzztime=20s
          go test ./internal/authn/saml -run=^$ -fuzz=FuzzParseResponse -fuzztime=30s
          go test ./internal/authn/saml -run=^$ -fuzz=FuzzParseMetadata -fuzztime=20s
          go test ./internal/authn/config -run=^$ -fuzz=FuzzCheck -fuzztime=20s
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 $AUTHN_PKGS
