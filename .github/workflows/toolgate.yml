name: toolgate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: toolgate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: toolgate/go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test (race, coverage)
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1
      - name: Fuzz (short)
        run: |
          go test ./internal/jsonrpc -run=^$ -fuzz=FuzzDecode -fuzztime=20s
          go test ./internal/schema -run=^$ -fuzz=FuzzCompileValidate -fuzztime=20s
          go test ./internal/policy -run=^$ -fuzz=FuzzParse -fuzztime=20s
          go test ./internal/policy -run=^$ -fuzz=FuzzCases -fuzztime=20s
          go test ./internal/identity -run=^$ -fuzz=FuzzAuthenticate -fuzztime=20s
          go test ./internal/audit -run=^$ -fuzz=FuzzVerify -fuzztime=20s
      - name: Policy cases
        run: go run ./cmd/toolgate policy test examples/policy.json examples/policy_cases.json
      - name: Demo
        run: ./examples/demo.sh
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
